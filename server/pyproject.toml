[project]
name = "readwell-server"
version = "0.1.0"
description = "Readwell simplify backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "pysbd==0.3.4",
  "textstat==0.7.13",
  "google-genai==2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx2==2.13.1",
  "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is kept verbatim from the spec.
"app/prompts.py" = ["E501"]
